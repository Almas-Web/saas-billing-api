name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_saas_billing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_saas_billing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-test-secret-key"
          DB_NAME: test_saas_billing
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py migrate

      - name: Collect static files
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-test-secret-key"
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py collectstatic --noinput

      - name: Run tests
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-test-secret-key"
          DB_NAME: test_saas_billing
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          SECURE_SSL_REDIRECT: "False"
        run: |
          pytest -q