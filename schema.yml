components:
  schemas:
    BillingCycleEnum:
      enum:
      - monthly
      - yearly
      type: string
      description: |-
        * `monthly` - Monthly
        * `yearly` - Yearly
    GatewayEnum:
      enum:
      - stripe
      - sslcommerz
      - bkash
      - nagad
      type: string
      description: |-
        * `stripe` - Stripe
        * `sslcommerz` - SSLCommerz
        * `bkash` - bKash
        * `nagad` - Nagad
    Invoice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        subscription:
          type: integer
          nullable: true
        payment:
          type: integer
          nullable: true
        stripe_invoice_id:
          type: string
          readOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 10
        status:
          allOf:
          - $ref: '#/components/schemas/InvoiceStatusEnum'
          readOnly: true
        invoice_date:
          type: string
          format: date-time
          readOnly: true
        due_date:
          type: string
          format: date-time
          nullable: true
